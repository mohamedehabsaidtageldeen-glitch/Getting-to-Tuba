<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة اليوم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F4EE;
    --surface: #FFFFFF;
    --ink: #22301F;
    --ink-soft: #5C6B57;
    --line: #DCE0D2;
    --accent: #3F6B4A;
    --accent-soft: #E4EDDE;
    --done: #9AA593;
    --habit: #B08A3E;
    --habit-soft: #F3EBD8;
    --danger: #B4543F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Tajawal', sans-serif;
    display: flex;
    justify-content: center;
    padding: 28px 16px 60px;
    min-height: 100vh;
  }
  .page { width: 100%; max-width: 480px; }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 22px;
  }
  .top h1 { font-size: 26px; font-weight: 900; margin: 0; }
  .top .date { font-size: 14px; color: var(--ink-soft); }

  .section-title { font-size: 15px; font-weight: 700; margin: 0 0 4px; }
  .section-sub { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 12px; }

  .add-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .add-row input {
    flex: 1;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 15px;
  }
  .add-row input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .add-row button {
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    color: var(--bg);
  }
  .add-row.tasks button { background: var(--accent); }
  .add-row.habits button { background: var(--habit); }

  ul.tasks, ul.habits { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .task {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 13px 14px;
  }
  .task .check {
    width: 21px; height: 21px;
    flex: none;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .task.done .check { background: var(--accent); }
  .task .check svg { width: 12px; height: 12px; opacity: 0; }
  .task.done .check svg { opacity: 1; }
  .task .label { flex: 1; font-size: 15px; word-break: break-word; }
  .task.done .label { color: var(--done); text-decoration: line-through; }
  .task .del, .habit .del {
    flex: none; background: none; border: none;
    color: var(--ink-soft); font-size: 18px; cursor: pointer;
    padding: 4px; line-height: 1;
  }
  .task .del:hover, .habit .del:hover { color: var(--danger); }

  .habit {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 13px 14px;
  }
  .habit.done { border-color: var(--habit); background: var(--habit-soft); }
  .habit .check {
    width: 21px; height: 21px;
    flex: none;
    border-radius: 6px;
    border: 2px solid var(--habit);
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .habit.done .check { background: var(--habit); }
  .habit .check svg { width: 12px; height: 12px; opacity: 0; }
  .habit.done .check svg { opacity: 1; }
  .habit .label { flex: 1; font-size: 15px; word-break: break-word; }
  .habit .tag {
    font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    white-space: nowrap; background: var(--accent-soft); color: var(--accent);
  }
  .habit .streak { font-size: 12.5px; font-weight: 700; color: var(--habit); white-space: nowrap; }

  .stat { font-size: 13px; color: var(--ink-soft); margin: -6px 0 14px; }
  .divider { height: 1px; background: var(--line); margin: 26px 0 20px; }

  .habit-form-row { display: flex; gap: 8px; }
  .habit-form-row select {
    padding: 0 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 13.5px;
  }
  .filters { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .filters button {
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .filters button.active { background: var(--habit-soft); color: var(--habit); border-color: var(--habit); }

  .empty {
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    padding: 30px 10px;
    border: 1px dashed var(--line);
    border-radius: 10px;
  }
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <h1>إدارة اليوم</h1>
    <span class="date" id="today"></span>
  </div>

  <div class="section-title">المهام</div>
  <div class="stat" id="taskStat"></div>
  <div class="add-row tasks">
    <input id="taskInput" type="text" placeholder="اكتب مهمة جديدة..." />
    <button id="addTaskBtn">إضافة</button>
  </div>
  <ul class="tasks" id="taskList"></ul>
  <div class="empty" id="emptyTasks" style="display:none;">مفيش مهام دلوقتي، ابدأ بإضافة أول مهمة ليومك</div>

  <div class="divider"></div>

  <div class="section-title">العادات اليومية</div>
  <div class="section-sub">علّم على أي عادة عملتها النهارده، والعداد بيحسب أيام الاستمرار</div>
  <div class="habit-form-row" style="margin-bottom:10px;">
    <input id="habitInput" type="text" placeholder="عادة جديدة (مثلاً: قرايه تركي، مذاكرة)..." style="flex:1; padding:13px 14px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-family:inherit; font-size:15px;" />
    <select id="habitCategory">
      <option value="عام">عام</option>
      <option value="دراسة">دراسة</option>
      <option value="لغة">لغة</option>
      <option value="تصميم">تصميم</option>
      <option value="برمجة">برمجة</option>
    </select>
  </div>
  <div class="add-row habits">
    <button id="addHabitBtn" style="width:100%;">إضافة العادة</button>
  </div>
  <div class="filters" id="habitFilters">
    <button class="active" data-cat="all">الكل</button>
    <button data-cat="دراسة">دراسة</button>
    <button data-cat="لغة">لغة</button>
    <button data-cat="تصميم">تصميم</button>
    <button data-cat="برمجة">برمجة</button>
  </div>
  <ul class="habits" id="habitList"></ul>
  <div class="empty" id="emptyHabits" style="display:none;">لسه معملتش أي عادة، ابدأ بإضافة أول عادة تحب تكررها</div>
</div>

<script>
  const TASK_KEY = 'day-management-tasks';
  const HABITS_KEY = 'day-management-habits';
  const HABITS_LOG_KEY = 'day-management-habits-log';

  const days = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const now = new Date();
  document.getElementById('today').textContent =
    days[now.getDay()] + '، ' + now.getDate() + ' ' + months[now.getMonth()];

  function toISO(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  const todayKey = toISO(new Date());

  // ---- Tasks ----
  let tasks = [];
  try { const s = localStorage.getItem(TASK_KEY); tasks = s ? JSON.parse(s) : []; } catch (e) { tasks = []; }

  const taskListEl = document.getElementById('taskList');
  const taskStatEl = document.getElementById('taskStat');
  const emptyTasksEl = document.getElementById('emptyTasks');
  const taskInput = document.getElementById('taskInput');

  function saveTasks() { try { localStorage.setItem(TASK_KEY, JSON.stringify(tasks)); } catch (e) {} }

  function renderTasks() {
    taskListEl.innerHTML = '';
    if (tasks.length === 0) {
      emptyTasksEl.style.display = 'block';
      taskStatEl.textContent = '';
      return;
    }
    emptyTasksEl.style.display = 'none';
    const remaining = tasks.filter(t => !t.done).length;
    taskStatEl.textContent = remaining === 0 ? 'خلصت كل مهامك النهارده 🌿' : remaining + ' مهمة متبقية من ' + tasks.length;

    tasks.forEach((t, i) => {
      const li = document.createElement('li');
      li.className = 'task' + (t.done ? ' done' : '');
      const check = document.createElement('button');
      check.className = 'check';
      check.setAttribute('aria-label', 'إنجاز المهمة');
      check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="4,12 9,17 20,6"/></svg>';
      check.onclick = () => { tasks[i].done = !tasks[i].done; saveTasks(); renderTasks(); };
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = t.text;
      const del = document.createElement('button');
      del.className = 'del';
      del.setAttribute('aria-label', 'حذف المهمة');
      del.textContent = '✕';
      del.onclick = () => { tasks.splice(i, 1); saveTasks(); renderTasks(); };
      li.appendChild(check); li.appendChild(label); li.appendChild(del);
      taskListEl.appendChild(li);
    });
  }

  document.getElementById('addTaskBtn').onclick = () => {
    const val = taskInput.value.trim();
    if (!val) return;
    tasks.push({ text: val, done: false });
    taskInput.value = '';
    saveTasks(); renderTasks();
  };
  taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('addTaskBtn').click(); });

  // ---- Habits ----
  let habits = [];
  try { const s = localStorage.getItem(HABITS_KEY); habits = s ? JSON.parse(s) : []; } catch (e) { habits = []; }
  let habitsLog = {};
  try { const s = localStorage.getItem(HABITS_LOG_KEY); habitsLog = s ? JSON.parse(s) : {}; } catch (e) { habitsLog = {}; }

  const habitListEl = document.getElementById('habitList');
  const emptyHabitsEl = document.getElementById('emptyHabits');
  const habitInput = document.getElementById('habitInput');
  const habitCategory = document.getElementById('habitCategory');
  let habitFilter = 'all';

  function saveHabits() { try { localStorage.setItem(HABITS_KEY, JSON.stringify(habits)); } catch (e) {} }
  function saveHabitsLog() { try { localStorage.setItem(HABITS_LOG_KEY, JSON.stringify(habitsLog)); } catch (e) {} }

  function isDoneToday(habitId) {
    return !!(habitsLog[todayKey] && habitsLog[todayKey][habitId]);
  }

  function calcStreak(habitId) {
    let streak = 0;
    let d = new Date();
    if (!isDoneToday(habitId)) d.setDate(d.getDate() - 1);
    while (true) {
      const key = toISO(d);
      if (habitsLog[key] && habitsLog[key][habitId]) {
        streak++;
        d.setDate(d.getDate() - 1);
      } else break;
    }
    return streak;
  }

  function toggleHabit(habitId) {
    habitsLog[todayKey] = habitsLog[todayKey] || {};
    habitsLog[todayKey][habitId] = !habitsLog[todayKey][habitId];
    saveHabitsLog();
    renderHabits();
  }

  function renderHabits() {
    habitListEl.innerHTML = '';
    const visible = habitFilter === 'all' ? habits : habits.filter(h => (h.category || 'عام') === habitFilter);

    if (habits.length === 0) {
      emptyHabitsEl.style.display = 'block';
      return;
    }
    emptyHabitsEl.style.display = 'none';

    if (visible.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.style.display = 'block';
      li.textContent = 'مفيش عادات في التصنيف ده';
      habitListEl.appendChild(li);
      return;
    }

    visible.forEach((h) => {
      const i = habits.indexOf(h);
      const done = isDoneToday(h.id);
      const streak = calcStreak(h.id);
      const li = document.createElement('li');
      li.className = 'habit' + (done ? ' done' : '');
      const check = document.createElement('button');
      check.className = 'check';
      check.setAttribute('aria-label', 'إنجاز العادة النهارده');
      check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="4,12 9,17 20,6"/></svg>';
      check.onclick = () => toggleHabit(h.id);
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = h.name;
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = h.category || 'عام';
      const streakEl = document.createElement('span');
      streakEl.className = 'streak';
      streakEl.textContent = streak > 0 ? '🔥 ' + streak + ' يوم' : '';
      const del = document.createElement('button');
      del.className = 'del';
      del.setAttribute('aria-label', 'حذف العادة');
      del.textContent = '✕';
      del.onclick = () => { habits.splice(i, 1); saveHabits(); renderHabits(); };
      li.appendChild(check); li.appendChild(label); li.appendChild(tag); li.appendChild(streakEl); li.appendChild(del);
      habitListEl.appendChild(li);
    });
  }

  document.getElementById('addHabitBtn').onclick = () => {
    const val = habitInput.value.trim();
    if (!val) return;
    habits.push({ id: 'h' + Date.now() + Math.random().toString(36).slice(2,6), name: val, category: habitCategory.value });
    habitInput.value = '';
    saveHabits(); renderHabits();
  };

  document.querySelectorAll('#habitFilters button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#habitFilters button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      habitFilter = btn.dataset.cat;
      renderHabits();
    };
  });
  habitInput.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('addHabitBtn').click(); });

  renderTasks();
  renderHabits();
</script>
</body>

</script>
<script src="shared.js"></script>
</body>
</html>
</html>
