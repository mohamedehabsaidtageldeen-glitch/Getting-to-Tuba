<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة العملاء</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F6F4EE;--surface:#FFF;--ink:#22301F;--ink-soft:#5C6B57;--line:#DCE0D2;--accent:#3F6B4A;--accent-soft:#E4EDDE;--wait:#7A7566;--wait-soft:#ECEAE2;--warn:#B08A3E;--warn-soft:#F3EBD8;--danger:#B4543F;--danger-soft:#F3E2DC}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',sans-serif;display:flex;justify-content:center;padding:28px 16px 90px;min-height:100vh}
  .page{width:100%;max-width:520px}
  h1{font-size:26px;font-weight:900;margin:0 0 4px}.sub{font-size:13px;color:var(--ink-soft);margin-bottom:16px}
  .sums{display:flex;gap:8px;margin-bottom:16px}
  .sums div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
  .sums small{display:block;font-size:11.5px;color:var(--ink-soft)}.sums b{font-size:15px}
  .form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:20px;display:flex;flex-direction:column;gap:10px}
  .form input,.form textarea{padding:12px 13px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit;font-size:14.5px;width:100%}
  .form .row{display:flex;gap:8px}.form .row input{flex:1}
  .form button.main{background:var(--accent);color:var(--bg);border:none;border-radius:9px;padding:12px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
  .filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .filters button{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .filters button.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .stat{font-size:13px;color:var(--ink-soft);margin-bottom:12px}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .client{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;border-right:4px solid var(--line)}
  .client.soon{border-right-color:var(--warn);background:var(--warn-soft)}
  .client.overdue{border-right-color:var(--danger);background:var(--danger-soft)}
  .name{font-size:16px;font-weight:700}.phone{font-size:13px;color:var(--ink-soft)}
  .job{font-size:14.5px;margin:8px 0;line-height:1.5}
  .dl{font-size:13px;font-weight:700;margin-bottom:8px}.dl span{font-weight:400;color:var(--ink-soft)}
  .client.soon .dl b{color:var(--warn)}.client.overdue .dl b{color:var(--danger)}
  .money{font-size:13px;color:var(--ink-soft);margin-bottom:10px}
  .bar{height:7px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden;margin-top:5px}
  .bar div{height:100%;background:var(--accent)}
  .foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .badge,.act{font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px;border:none;cursor:pointer;font-family:inherit}
  .badge.waiting{background:var(--wait-soft);color:var(--wait)}.badge.progress{background:var(--accent-soft);color:var(--accent)}.badge.done{background:var(--accent);color:var(--bg)}
  .act{background:var(--bg);color:var(--ink);border:1px solid var(--line);text-decoration:none}
  .act.wa{background:#25D366;color:#fff;border-color:#25D366}
  .del{background:none;border:none;color:var(--ink-soft);font-size:17px;cursor:pointer;margin-right:auto}.del:hover{color:var(--danger)}
  .empty{text-align:center;color:var(--ink-soft);font-size:14px;padding:40px 10px;border:1px dashed var(--line);border-radius:10px}
</style>
</head>
<body>
<div class="page">
  <h1>إدارة العملاء</h1>
  <div class="sub">الشغل والفلوس ومواعيد التسليم في مكان واحد</div>

  <div class="sums">
    <div><small>إجمالي الأسعار</small><b id="sTotal">0</b></div>
    <div><small>اتحصّل</small><b id="sPaid">0</b></div>
    <div><small>متبقي عند العملاء</small><b id="sLeft">0</b></div>
  </div>

  <div class="form">
    <div class="row"><input id="nameInput" placeholder="اسم العميل"><input id="phoneInput" placeholder="رقم الموبايل / واتساب"></div>
    <textarea id="jobInput" placeholder="الشغل المطلوب" style="padding:12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit;font-size:14.5px"></textarea>
    <div class="row"><input id="priceInput" type="number" placeholder="السعر (اختياري)"><input id="dateInput" type="date"></div>
    <button class="main" id="addBtn">إضافة عميل</button>
  </div>

  <div class="filters">
    <button class="active" data-filter="all">الكل</button><button data-filter="active">شغالة</button>
    <button data-filter="soon">مستعجلة</button><button data-filter="unpaid">لسه ماتدفعش</button><button data-filter="done">مسلّمة</button>
  </div>
  <div class="stat" id="stat"></div>
  <ul id="list"></ul>
  <div class="empty" id="emptyMsg" style="display:none">لسه معندكش عملاء، ابدأ بإضافة أول عميل</div>
</div>
<script src="shared.js"></script>
<script>
  const KEY='client-management-data';
  const ST=[{k:'waiting',l:'لسه هيبدأ'},{k:'progress',l:'قيد التنفيذ'},{k:'done',l:'تم التسليم'}];
  const MO=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  let clients=[];try{clients=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
  let filter='all';
  const $=id=>document.getElementById(id);
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(clients))}catch(e){}};
  const num=v=>parseFloat(v)||0;
  const fmt=n=>n.toLocaleString('ar-EG')+' ج';
  const fd=iso=>{const d=new Date(iso+'T00:00:00');return d.getDate()+' '+MO[d.getMonth()]};
  const left=iso=>{const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(iso+'T00:00:00')-t)/864e5)};
  function urg(c){if(!c.deadline||c.status==='done')return'';const d=left(c.deadline);return d<0?'overdue':d<=2?'soon':''}
  function dlLabel(c){const d=left(c.deadline);if(c.status==='done')return'تم التسليم';if(d<0)return'اتأخر '+Math.abs(d)+' يوم';if(d===0)return'التسليم النهاردة';if(d===1)return'التسليم بكرة';return'باقي '+d+' يوم'}
  function waLink(p){let d=(p||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='2'+d;return d?'https://wa.me/'+d:''}
  function addIncome(desc,amount){
    let t=[];try{t=JSON.parse(localStorage.getItem('finance-data'))||[]}catch(e){}
    t.push({type:'in',desc,amount,cat:'شغل عملاء',createdAt:Date.now()});
    try{localStorage.setItem('finance-data',JSON.stringify(t))}catch(e){}
  }
  function render(){
    const l=$('list');l.innerHTML='';
    const price=clients.reduce((s,c)=>s+num(c.price),0),paid=clients.reduce((s,c)=>s+num(c.paid),0);
    $('sTotal').textContent=fmt(price);$('sPaid').textContent=fmt(paid);$('sLeft').textContent=fmt(Math.max(0,price-paid));
    if(!clients.length){$('emptyMsg').style.display='block';$('stat').textContent='';return}
    $('emptyMsg').style.display='none';
    $('stat').textContent=clients.filter(c=>c.status!=='done').length+' شغلانة شغالة من '+clients.length+' عميل';
    let f=clients.map((c,i)=>({c,i}));
    if(filter==='active')f=f.filter(x=>x.c.status!=='done');
    if(filter==='done')f=f.filter(x=>x.c.status==='done');
    if(filter==='soon')f=f.filter(x=>urg(x.c));
    if(filter==='unpaid')f=f.filter(x=>num(x.c.price)-num(x.c.paid)>0);
    f.sort((a,b)=>{const x=a.c.status==='done'?1:0,y=b.c.status==='done'?1:0;if(x!==y)return x-y;if(a.c.deadline&&b.c.deadline)return new Date(a.c.deadline)-new Date(b.c.deadline);return a.c.deadline?-1:b.c.deadline?1:0});
    f.forEach(({c,i})=>{
      const li=document.createElement('li');const u=urg(c);li.className='client'+(u?' '+u:'');
      const p=num(c.price),pd=num(c.paid),rem=Math.max(0,p-pd),pct=p?Math.min(100,pd/p*100):0;
      const s=ST.find(x=>x.k===c.status)||ST[0],wa=waLink(c.phone);
      li.innerHTML=`<div class="name"></div><div class="phone"></div><div class="job"></div>
        ${c.deadline?'<div class="dl"><b></b> <span></span></div>':''}
        ${p?`<div class="money">السعر: ${fmt(p)} • مدفوع: ${fmt(pd)} • متبقي: <b>${fmt(rem)}</b><div class="bar"><div style="width:${pct}%"></div></div></div>`:''}
        <div class="foot"><button class="badge ${s.k}">${s.l}</button>
        ${p&&rem>0?'<button class="act pay">+ دفعة</button>':''}
        ${wa?`<a class="act wa" target="_blank" href="${wa}">واتساب</a>`:''}
        <button class="act ed">تعديل</button><button class="del">✕</button></div>`;
      li.querySelector('.name').textContent=c.name;li.querySelector('.phone').textContent=c.phone||'';
      li.querySelector('.job').textContent=c.job||'';
      if(c.deadline){li.querySelector('.dl b').textContent=dlLabel(c);li.querySelector('.dl span').textContent='('+fd(c.deadline)+')'}
      li.querySelector('.badge').onclick=()=>{clients[i].status=ST[(ST.findIndex(x=>x.k===c.status)+1)%3].k;save();render()};
      const pay=li.querySelector('.pay');
      if(pay)pay.onclick=()=>{const a=num(prompt('المبلغ اللي العميل دفعه (متبقي '+rem+'):'));if(a<=0)return;clients[i].paid=pd+a;addIncome('دفعة من '+c.name,a);save();render()};
      li.querySelector('.ed').onclick=()=>{
        const n=prompt('اسم العميل:',c.name);if(n===null)return;
        const ph=prompt('الموبايل:',c.phone||'');const j=prompt('الشغل:',c.job||'');
        const pr=prompt('السعر:',c.price||'');const dt=prompt('ميعاد التسليم (سنة-شهر-يوم مثلاً 2026-10-15):',c.deadline||'');
        Object.assign(clients[i],{name:n.trim()||c.name,phone:(ph||'').trim(),job:(j||'').trim(),price:pr||'',deadline:/^\d{4}-\d{2}-\d{2}$/.test(dt||'')?dt:null});save();render();
      };
      li.querySelector('.del').onclick=()=>{if(confirm('تحذف العميل ده؟')){clients.splice(i,1);save();render()}};
      l.appendChild(li);
    });
  }
  $('addBtn').onclick=()=>{
    const name=$('nameInput').value.trim();if(!name)return;
    clients.push({name,phone:$('phoneInput').value.trim(),job:$('jobInput').value.trim(),price:$('priceInput').value,paid:0,deadline:$('dateInput').value||null,status:'waiting'});
    ['nameInput','phoneInput','jobInput','priceInput','dateInput'].forEach(id=>$(id).value='');save();render();
  };
  document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render();
  });
  render();
</script>
</body>
</html>
