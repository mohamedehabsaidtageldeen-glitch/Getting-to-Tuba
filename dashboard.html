<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الداش بورد</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F6F4EE;--surface:#FFF;--ink:#22301F;--ink-soft:#5C6B57;--line:#DCE0D2;--accent:#3F6B4A;--accent-soft:#E4EDDE;--warn:#B08A3E;--danger:#B4543F}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',sans-serif;padding:24px 16px 110px;display:flex;justify-content:center}
  .page{width:100%;max-width:1100px}
  .head{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
  .head h1{font-size:26px;font-weight:900;margin:0 0 4px}
  .head .d{font-size:13px;color:var(--ink-soft)}
  .ring{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
  .ring div{width:74px;height:74px;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring b{font-size:24px;font-weight:900}.ring small{font-size:10.5px;color:var(--ink-soft)}
  .quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .quick a{font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
  .kpi small{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px}
  .kpi b{font-size:22px;font-weight:900}.kpi i{display:block;font-style:normal;font-size:11.5px;color:var(--ink-soft);margin-top:3px}
  .panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
  .panel h3{font-size:15px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
  .panel h3 a{font-size:12px;font-weight:400;color:var(--accent);text-decoration:none}
  .row{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin:9px 0 3px}
  .row span{color:var(--ink-soft);font-size:12.5px;white-space:nowrap}
  .bar{height:8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
  .bar div{height:100%;background:var(--accent)}.bar.w div{background:var(--warn)}.bar.b div{background:var(--danger)}
  .now{border:2px solid var(--accent);border-radius:10px;padding:4px 8px;background:var(--accent-soft)}
  .chart{display:flex;gap:6px;align-items:flex-end;height:120px}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
  .col em{font-style:normal;font-size:10.5px;color:var(--ink-soft);min-height:14px}
  .col .t{flex:1;width:100%;display:flex;align-items:flex-end}
  .col .f{width:100%;background:var(--line);border-radius:6px 6px 0 0;min-height:2px}.col .f.today{background:var(--accent)}
  .col small{font-size:11px;color:var(--ink-soft);margin-top:4px}
  .heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:10px}
  .heat i{aspect-ratio:1;border-radius:4px;background:var(--accent)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chips span{font-size:12.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);padding:5px 11px;border-radius:999px}
  .chips span.w{background:#F3EBD8;color:var(--warn)}.chips span.b{background:#F3E2DC;color:var(--danger)}
  .empty{font-size:13px;color:var(--ink-soft);padding:10px 0}
  .big{font-size:26px;font-weight:900}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .two div{background:var(--bg);border-radius:10px;padding:10px;text-align:center;font-size:12px;color:var(--ink-soft)}
  .two b{display:block;font-size:16px;color:var(--ink)}
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <div class="ring" id="ring"><div><b id="score">0</b><small>نتيجة اليوم</small></div></div>
    <div><h1 id="hello"></h1><div class="d" id="date"></div><div class="d" id="scoreNote"></div></div>
  </div>
  <div class="quick" id="quick"></div>
  <div class="kpis" id="kpis"></div>
  <div class="panels" id="panels"></div>
</div>
<script src="shared.js"></script>
<script>
  const $=id=>document.getElementById(id);
  const rd=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?f:v}catch(e){return f}};
  const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const num=v=>parseFloat(v)||0;
  const fm=v=>Math.round(v).toLocaleString('ar-EG');
  const hm=m=>{const h=Math.floor(m/60),r=m%60;return h?h+'س'+(r?' '+r+'د':''):r+'د'};
  const daysTo=s=>Math.round((new Date(s+'T00:00:00')-new Date(new Date().setHours(0,0,0,0)))/864e5);
  const bar=(p,c)=>'<div class="bar '+(c||'')+'"><div style="width:'+Math.max(0,Math.min(100,p))+'%"></div></div>';
  const panel=(t,link,body)=>'<section class="panel"><h3>'+t+(link?'<a href="'+link+'">فتح ←</a>':'')+'</h3>'+body+'</section>';
  const DAYS=['أحد','إثن','ثلا','أرب','خمي','جمع','سبت'];
  const LV=[[16,'إنقاذ الدراسة وبداية البناء',9],[17,'تحويل الهوايات لمهارات',6],[18,'تبقى معروف في مجالك',5],[19,'الثانوية والمنحة',5],[20,'الوصول إلى تركيا',5],[21,'بناء الشبكة',3],[22,'صاحب البيزنس',3],[23,'الاسم والمكانة',3]];
  const AGE=16;
  const LVL=['A1','A2','B1','B2','C1','C2'];
  const LN={tr:'التركي',en:'الإنجليزي'};

  function render(){
    const now=new Date(),today=iso(now);
    // ---------- قراءة البيانات ----------
    const tasks=rd('day-management-tasks',[]),habits=rd('day-management-habits',[]),hl=rd('day-management-habits-log',{});
    const fl=rd('focus-log',{}),target=rd('focus-target',180);
    const goals=rd('goals-data',[]),fin=rd('finance-data',[]),cfg=rd('finance-settings',{}),cl=rd('client-management-data',[]);
    const ck=rd('dream-checks',{}),st=rd('study-data',{subjects:[],exams:[],errors:[]});
    const ld=rd('languages-data',{}),lv=rd('languages-vocab',{}),ll=rd('languages-log',{});
    const notes=rd('notes-data',[]);
    const dayFocus=k=>Object.values(fl[k]||{}).reduce((a,b)=>a+b,0);
    const habDone=k=>habits.filter(h=>hl[k]&&hl[k][h.id]).length;
    const streak=id=>{let s=0,d=new Date();if(!(hl[iso(d)]&&hl[iso(d)][id]))d.setDate(d.getDate()-1);while(hl[iso(d)]&&hl[iso(d)][id]){s++;d.setDate(d.getDate()-1)}return s};

    // ---------- الترحيبة والنتيجة ----------
    const h=now.getHours(),name=(rd('app-profile',{}).name||'محمد');
    $('hello').textContent=(h<12?'صباح الخير':h<18?'مساء النور':'مساء الخير')+' يا '+name;
    $('date').textContent=new Intl.DateTimeFormat('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(now);
    const tDone=tasks.filter(t=>t.done).length,hDone=habDone(today),fToday=dayFocus(today);
    const parts=[];
    if(tasks.length)parts.push(tDone/tasks.length);
    if(habits.length)parts.push(hDone/habits.length);
    parts.push(Math.min(1,fToday/target));
    const score=Math.round(parts.reduce((a,b)=>a+b,0)/parts.length*100);
    $('score').textContent=score;
    $('ring').style.background='conic-gradient(var(--accent) '+score+'%,var(--line) 0)';
    $('scoreNote').textContent=score>=80?'يوم ممتاز، كمّل 🔥':score>=50?'ماشي كويس، فاضل شوية':'لسه في وقت تظبط يومك';

    // ---------- روابط سريعة ----------
    $('quick').innerHTML=[['day-management','🌿 اليوم'],['focus','⏱️ تركيز'],['study','📚 مذاكرة'],['languages','🌍 لغات'],['goals','🎯 أهداف'],['clients','👥 عملاء'],['finance','💰 فلوس'],['notes','📝 ملاحظات'],['dream','🚀 الحلم']].map(x=>'<a href="'+x[0]+'.html">'+x[1]+'</a>').join('');

    // ---------- الأرقام الكبيرة ----------
    const bal=fin.reduce((s,t)=>s+(t.type==='in'?t.amount:-t.amount),0);
    const owed=cl.reduce((s,c)=>s+Math.max(0,num(c.price)-num(c.paid)),0);
    const openErr=(st.errors||[]).filter(e=>!e.fixed).length;
    const due=Object.keys(lv).reduce((s,c)=>s+(lv[c]||[]).filter(o=>o.due<=today).length,0);
    const bestStreak=habits.reduce((m,x)=>Math.max(m,streak(x.id)),0);
    const K=[['✅','مهام النهارده',tDone+' / '+tasks.length,tasks.length-tDone+' متبقية'],
      ['🌿','عادات النهارده',hDone+' / '+habits.length,'أطول استمرار '+bestStreak+' يوم'],
      ['⏱️','تركيز النهارده',hm(fToday),'الهدف '+hm(target)],
      ['💰','الرصيد',fm(bal)+' ج','الكلي'],
      ['👥','فلوس عند العملاء',fm(owed)+' ج',cl.filter(c=>c.status!=='done').length+' شغلانة شغالة'],
      ['🎯','أهداف خلصانة',goals.filter(g=>g.progress>=100).length+' / '+goals.length,'من كل الأهداف'],
      ['📕','أخطاء مش متصلحة',openErr,'في دفتر الأخطاء'],
      ['🔁','كلمات للمراجعة',due,'كارت مستحق النهارده'],
      ['📝','الملاحظات',notes.length,notes.filter(n=>n.pinned).length+' مثبّتة']];
    $('kpis').innerHTML=K.map(k=>'<div class="kpi"><small>'+k[0]+' '+k[1]+'</small><b>'+k[2]+'</b><i>'+k[3]+'</i></div>').join('');

    const P=[];
    // ---------- رحلة الحلم ----------
    let tot=0,dn=0;
    const lvRows=LV.map((l,i)=>{let d=0;for(let j=0;j<l[2];j++)if(ck[i+'-'+j])d++;tot+=l[2];dn+=d;const p=Math.round(d/l[2]*100);
      return '<div class="'+(l[0]===AGE?'now':'')+'"><div class="row"><b>Level '+l[0]+': '+l[1]+'</b><span>'+d+'/'+l[2]+' • '+p+'%</span></div>'+bar(p)+'</div>'}).join('');
    P.push(panel('🚀 رحلة الحلم','dream.html','<div class="big">'+Math.round(dn/tot*100)+'%</div><div class="empty" style="padding:0 0 6px">الرحلة كلها</div>'+lvRows));

    // ---------- التركيز ----------
    const bars=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);bars.push({l:DAYS[d.getDay()],v:dayFocus(iso(d)),t:i===0,k:iso(d)})}
    const mx=Math.max(60,...bars.map(b=>b.v)),wk=bars.reduce((a,b)=>a+b.v,0);
    const cat={};bars.forEach(b=>Object.entries(fl[b.k]||{}).forEach(([c,m])=>cat[c]=(cat[c]||0)+m));
    P.push(panel('⏱️ التركيز آخر 7 أيام','focus.html','<div class="chart">'+bars.map(b=>'<div class="col"><em>'+(b.v?hm(b.v):'')+'</em><div class="t"><div class="f'+(b.t?' today':'')+'" style="height:'+b.v/mx*100+'%"></div></div><small>'+b.l+'</small></div>').join('')+'</div>'+
      '<div class="row"><span>الإجمالي '+hm(wk)+' • المتوسط '+hm(Math.round(wk/7))+' يوميًا</span></div>'+
      '<div class="chips">'+(Object.keys(cat).length?Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(([c,m])=>'<span>'+esc(c)+': '+hm(m)+'</span>').join(''):'<div class="empty">لسه مفيش تركيز متسجل الأسبوع ده</div>')+'</div>'));

    // ---------- العادات ----------
    let heat='';for(let i=27;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const p=habits.length?habDone(iso(d))/habits.length:0;heat+='<i title="'+iso(d)+'" style="opacity:'+(0.12+p*0.88)+'"></i>'}
    P.push(panel('🌿 العادات','day-management.html',
      (habits.length?habits.map(x=>{const on=hl[today]&&hl[today][x.id],s=streak(x.id);return '<div class="row"><b>'+(on?'✅':'⬜')+' '+esc(x.name)+'</b><span>'+(s?'🔥 '+s+' يوم':'—')+'</span></div>'}).join('')+'<div class="empty" style="padding:8px 0 0">آخر 28 يوم (الأغمق = التزام أكتر)</div><div class="heat">'+heat+'</div>':'<div class="empty">لسه مضفتش عادات</div>')));

    // ---------- الأهداف ----------
    const gl=goals.filter(g=>g.progress<100).sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1).slice(0,5);
    P.push(panel('🎯 الأهداف الشغالة','goals.html',gl.length?gl.map(g=>{const dd=g.due?daysTo(g.due):null;
      return '<div class="row"><b>'+esc(g.name)+'</b><span>'+g.progress+'%'+(dd!==null?' • '+(dd<0?'متأخر '+(-dd)+' يوم':'باقي '+dd+' يوم'):'')+'</span></div>'+bar(g.progress,dd!==null&&dd<0?'b':'')}).join(''):'<div class="empty">مفيش أهداف شغالة. ضيف هدف من صفحة الأهداف</div>'));

    // ---------- المصاريف ----------
    const mk=t=>{const d=new Date(t);return d.getFullYear()+'-'+d.getMonth()};
    const thisM=now.getFullYear()+'-'+now.getMonth();
    const mIn=fin.filter(t=>t.type==='in'&&mk(t.createdAt)===thisM).reduce((s,t)=>s+t.amount,0);
    const mOutArr=fin.filter(t=>t.type==='out'&&mk(t.createdAt)===thisM),mOut=mOutArr.reduce((s,t)=>s+t.amount,0);
    const byCat={};mOutArr.forEach(t=>byCat[t.cat||'أخرى']=(byCat[t.cat||'أخرى']||0)+t.amount);
    const bp=cfg.budget>0?mOut/cfg.budget*100:0,gp=cfg.goalAmt>0?Math.max(0,bal)/cfg.goalAmt*100:0;
    P.push(panel('💰 فلوس الشهر','finance.html','<div class="two"><div>دخل<b style="color:var(--accent)">'+fm(mIn)+' ج</b></div><div>مصروف<b style="color:var(--danger)">'+fm(mOut)+' ج</b></div></div>'+
      (cfg.budget>0?'<div class="row"><b>الميزانية</b><span>'+fm(mOut)+' من '+fm(cfg.budget)+'</span></div>'+bar(bp,bp>=100?'b':bp>=80?'w':''):'<div class="empty">حدد ميزانية من صفحة الفلوس</div>')+
      (cfg.goalAmt>0?'<div class="row"><b>'+esc(cfg.goalName||'هدف الادخار')+'</b><span>'+Math.round(gp)+'%</span></div>'+bar(gp):'')+
      '<div class="chips">'+Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>'<span class="b">'+esc(c)+': '+fm(v)+'</span>').join('')+'</div>'));

    // ---------- العملاء ----------
    const urgent=cl.filter(c=>c.status!=='done'&&c.deadline&&daysTo(c.deadline)<=3).sort((a,b)=>a.deadline<b.deadline?-1:1).slice(0,5);
    P.push(panel('👥 العملاء والتسليمات','clients.html','<div class="two"><div>اتحصّل<b>'+fm(cl.reduce((s,c)=>s+num(c.paid),0))+' ج</b></div><div>متبقي<b>'+fm(owed)+' ج</b></div></div>'+
      (urgent.length?urgent.map(c=>{const d=daysTo(c.deadline);return '<div class="row"><b>'+esc(c.name)+'</b><span style="color:'+(d<0?'var(--danger)':'var(--warn)')+'">'+(d<0?'اتأخر '+(-d)+' يوم':d===0?'النهارده':'باقي '+d+' يوم')+'</span></div><div class="empty" style="padding:0">'+esc(c.job||'')+'</div>'}).join(''):'<div class="empty">مفيش تسليمات مستعجلة 👌</div>')));

    // ---------- المذاكرة ----------
    const ex=(st.exams||[]).filter(e=>daysTo(e.date)>=0).sort((a,b)=>a.date<b.date?-1:1).slice(0,4),sn=id=>((st.subjects||[]).find(s=>s.id===id)||{}).name||'';
    P.push(panel('📚 المذاكرة','study.html',(ex.length?ex.map(e=>{const d=daysTo(e.date);return '<div class="row"><b>'+esc(sn(e.subject))+' '+esc(e.title||'')+'</b><span style="color:'+(d<=3?'var(--danger)':'var(--ink-soft)')+'">باقي '+d+' يوم</span></div>'}).join(''):'<div class="empty">مفيش امتحانات جاية متسجلة</div>')+
      '<div class="chips"><span class="b">أخطاء مفتوحة: '+openErr+'</span><span>مواد: '+(st.subjects||[]).length+'</span></div>'));

    // ---------- اللغات ----------
    const lk=Object.keys(ld).filter(k=>ld[k]&&ld[k].on);
    P.push(panel('🌍 اللغات','languages.html',lk.length?lk.map(k=>{const x=ld[k],dc=(lv[k]||[]).filter(o=>o.due<=today).length;
      const lp=(x.lv||0)/5*100;return '<div class="row"><b>'+(LN[k]||k)+' • '+LVL[x.lv||0]+' ← '+esc(x.goal||'')+'</b><span>'+(x.words||0)+' كلمة • '+hm(x.mins||0)+'</span></div>'+bar(lp)+'<div class="empty" style="padding:2px 0 0">مراجعة مستحقة: '+dc+' كارت</div>'}).join(''):'<div class="empty">فعّل لغة من صفحة اللغات</div>'));

    // ---------- النسخة الاحتياطية ----------
    let lb=0;try{lb=parseInt(localStorage.getItem('app-last-backup'),10)||0}catch(e){}
    const ago=lb?Math.floor((Date.now()-lb)/864e5):null;
    P.push(panel('🛟 حماية البيانات','', '<div class="big" style="color:'+(ago===null||ago>7?'var(--danger)':'var(--accent)')+'">'+(ago===null?'مفيش نسخة':ago===0?'النهارده':'من '+ago+' يوم')+'</div><div class="empty">آخر نسخة احتياطية. من "المزيد ← تصدير".</div>'));

    $('panels').innerHTML=P.join('');
  }
  render();
  window.addEventListener('storage',render);
  setInterval(render,60000);
</script>
</body>
</html>
